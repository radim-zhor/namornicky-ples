# ============================================================
#  RUMOVÁ STRÁNKA – namornicky-ples.cz/rum/
#  Stránka není v menu webu, otevírá se odkazem nebo QR kódem.
# ============================================================

# Co stránka ukazuje:
anketa: true          # záložka Anketa (hlasování o výročním rumu)
vecer: true           # záložka Můj večer (osobní degustace). Na plese nechat true.

# Adresa Google Apps Scriptu, kam se posílají hlasy a anonymní hodnocení.
# Prázdné = nic se neodesílá, hodnocení zůstává jen v telefonu hosta.
odesilani_url: ""

# Poznámka nad lístkem (prázdné = žádná)
listek_poznamka: "Ukázka podle lístku 2026. Letošní lístek zveřejníme v prosinci."

# ---------- ANKETA ----------
anketa_nadpis: "Vyberte výroční rum 20. plesu"
anketa_uvod: "K 20. ročníku nalijeme jeden rum navíc, slavnostní. Tři kandidáty jsme vybrali a ochutnali, poslední slovo máte vy."
anketa_konec: "6. 12. 2026"           # hlasování pá 20. 11. – ne 6. 12., vítěz út 8. 12. (návrh, čeká na potvrzení)
anketa_losovani: "Ze všech, kdo vyplní e-mail, vylosujeme na plese tři hosty, kteří dostanou panáka výročního rumu."
# Kandidáti na výroční rum (NÁVRH – potvrdit na poradě)
kandidati:
  - id: dictador-20
    nazev: Dictador 20 Years
    puvod: Kolumbie
    cukr: 3
    chut: káva, karamel, kakao
    popis: Dvacítka přímo v názvu. Plný, kulatý rum zrající v dubových sudech systémem solera.
  - id: el-dorado-21
    nazev: El Dorado 21
    puvod: Guyana
    cukr: 4
    chut: sušené ovoce, kakao, melasa
    popis: Prémiový rum z demerarských palíren, hutný a dlouhý. Pro ty, kdo mají rádi tmavé rumy.
  - id: zacapa-23
    nazev: Ron Zacapa 23
    puvod: Guatemala
    cukr: 4
    chut: med, vanilka, sušené švestky
    popis: Klasika z vysočiny Guatemaly, zraje ve výšce 2 300 m. Jemný, sladší a velmi oblíbený.

# Druhá otázka ankety: kolik loňských rumů může host označit
oblibene_max: 3

# ---------- LÍSTEK ----------
# cukr: 1 = suchý … 5 = sladký. novinka: true = značka Novinka. vyrocni: true = výroční rum.
# popis: krátký text (návrhy popisů zkontrolovat před plesem)
# foto: název souboru v assets/img/rumy/ (nepovinné)
rumy:
  - id: xaymaca
    foto: xaymaca.webp
    nazev: Plantation Xaymaca
    puvod: Jamajka
    cukr: 1
    cena: 80
    chut: dub, cukrová třtina, kouřové tóny
    popis: Suchý jamajský rum z kotlových destilátorů. Výrazný, ovocný a lehce kouřový.
  - id: abuelo-12
    nazev: Abuelo Añejo 12
    puvod: Panama
    stari: 12 let
    cukr: 2
    cena: 100
    chut: kokos, dřevo
    popis: Tmavý rum španělského typu od rodinné palírny Varela Hermanos, která pěstuje všechnu třtinu na vlastních plantážích.
  - id: kirk-sweeney
    foto: kirk-sweeney.webp
    nazev: Kirk & Sweeney Gran Reserva
    puvod: Dominikánská republika
    stari: 12 let
    cukr: 2
    cena: 140
    chut: vanilka, mandle, med
    popis: Pojmenovaný po škuneru, který za prohibice pašoval rum. Jemný a přístupný.
  - id: eminente-7
    nazev: Eminente Reserva
    puvod: Kuba
    stari: 7 let
    cukr: 3
    cena: 180
    chut: kouř, vanilka, káva
    popis: Kubánský rum s vyšším podílem silnějších destilátů, proto plnější a výraznější než běžné kubánské rumy.
  - id: arehucas-12
    nazev: Arehucas 12
    puvod: Kanárské ostrovy
    stari: 12 let
    cukr: 3
    cena: 140
    chut: vanilka, cukrová třtina, ořechy, dub
    popis: Rum z Gran Canarie, z jedné z nejstarších evropských palíren rumu.
  - id: mount-gay-xo
    nazev: Mount Gay XO
    puvod: Barbados
    cukr: 3
    cena: 180
    chut: kouř, vanilka, banán
    popis: Barbados, nejstarší rumová značka světa. Blend rumů stařených 8 až 15 let.
  - id: flor-de-cana-18
    nazev: Flor de Caña Centenario 18
    puvod: Nikaragua
    stari: 18 let
    cukr: 3
    cena: 120
    chut: karamel, čokoláda, jemná elegance

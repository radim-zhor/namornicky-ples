galerie_alba: ""                # odkaz na všechna alba (např. Facebook)

# Časté dotazy
dotazy:
  - otazka: Jaké oblečení na ples?
    odpoved: Společenský oděv. Pánové oblek, dámy večerní nebo koktejlové šaty. Námořnický doplněk potěší.
  - otazka: Dají se koupit vstupenky na místě?
    odpoved: Ne, vstupenky prodáváme pouze online na tomto webu.
  - otazka: Kde zaparkuji?
    odpoved: U sokolovny a v okolních ulicích. Doporučujeme domluvit se na odvozu.


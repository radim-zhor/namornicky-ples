    var p = location.pathname;
    if (/^\/(cs|sk|en|de|pl|es|uk)\/(reservation|r|term|customer|voucher|payment|account)(\/|$)/.test(p) || /^\/r\//.test(p)) {
      location.replace("https://namornicky-ples.reenio.cz" + p + location.search + location.hash);
    }
  })();
</script>
